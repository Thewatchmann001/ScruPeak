server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # CSP headers for Privy iframe support
    add_header Content-Security-Policy "frame-ancestors 'self' https://auth.privy.io https://embedded.privy.io; default-src 'self'; script-src 'self' 'unsafe-inline' https://auth.privy.io; connect-src 'self' https://auth.privy.io https://api.privy.io https://api-gateway-prod-kqr3pbuu3a-uc.a.run.app https://explorer-api.walletconnect.com; frame-src 'self' https://auth.privy.io https://embedded.privy.io; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https:;" always;
    
    # Additional security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Allow Privy embedding
    add_header X-Frame-Options "ALLOWALL" always;

    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Ensure CSP headers are sent for HTML
        add_header Content-Security-Policy "frame-ancestors 'self' https://auth.privy.io https://embedded.privy.io; default-src 'self'; script-src 'self' 'unsafe-inline' https://auth.privy.io; connect-src 'self' https://auth.privy.io https://api.privy.io https://api-gateway-prod-kqr3pbuu3a-uc.a.run.app https://explorer-api.walletconnect.com; frame-src 'self' https://auth.privy.io https://embedded.privy.io; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://unpkg.com; font-src 'self' data: https:;" always;
    }

    location /api/ {
        proxy_pass https://api-gateway-prod-kqr3pbuu3a-uc.a.run.app/;
        proxy_set_header Host api-gateway-prod-kqr3pbuu3a-uc.a.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $server_name;
        
        # CORS headers passthrough
        proxy_pass_header Access-Control-Allow-Origin;
        proxy_pass_header Access-Control-Allow-Methods;
        proxy_pass_header Access-Control-Allow-Headers;
        proxy_pass_header Access-Control-Credentials;
        
        # Handle OPTIONS (preflight) requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' $http_origin;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD';
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-privy-token';
            add_header 'Access-Control-Allow-Credentials' 'true';
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
