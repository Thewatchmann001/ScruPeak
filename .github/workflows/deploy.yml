name: Deploy ScruPeak Microservices to GCP Cloud Run

"on":
  push:
    branches:
      - main
      - master
      - staging
      - develop
  pull_request:
    branches:
      - main
      - staging
  workflow_dispatch:

env:
  GCP_PROJECT_ID: scrupeak01
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  REGISTRY_REPO: scrupeak-services
  WORKLOAD_IDENTITY_PROVIDER: projects/1090857402667/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  SERVICE_ACCOUNT: scrupeak001@scrupeak01.iam.gserviceaccount.com
  CLOUD_SQL_INSTANCE: scrupeak01:us-central1:scrupeak-db

jobs:

  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changed.outputs.services }}
      environment: ${{ steps.env.outputs.environment }}
      needs_migration: ${{ steps.changed.outputs.needs_migration }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]] || \
             [[ "${{ github.ref }}" == "refs/heads/master" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
          fi

      - name: Detect changed services
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          CHANGED=$(git diff --name-only HEAD^ HEAD 2>/dev/null || \
                    git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || \
                    git ls-files)

          echo "Changed files:"
          echo "$CHANGED"

          SERVICES=(
            "apps/ai-service:ai-service"
            "apps/api-gateway:api-gateway"
            "apps/backend:backend"
            "apps/spatial-service:spatial-service"
            "apps/web:web"
          )

          DB_SERVICES=("backend" "ai-service" "spatial-service")

          CHANGED_SERVICES=()
          NEEDS_MIGRATION=false

          for SERVICE_ENTRY in "${SERVICES[@]}"; do
            FOLDER="${SERVICE_ENTRY%%:*}"
            NAME="${SERVICE_ENTRY##*:}"
            if echo "$CHANGED" | grep -q "^${FOLDER}/"; then
              CHANGED_SERVICES+=("$SERVICE_ENTRY")
              for DB_SVC in "${DB_SERVICES[@]}"; do
                if [[ "$NAME" == "$DB_SVC" ]]; then
                  NEEDS_MIGRATION=true
                fi
              done
            fi
          done

          if echo "$CHANGED" | grep -qE "^(shared/|package\.json|turbo\.json|nx\.json|\.env\.example)"; then
            echo "Root/shared config changed — rebuilding all services"
            CHANGED_SERVICES=("${SERVICES[@]}")
            NEEDS_MIGRATION=true
          fi

          if [ ${#CHANGED_SERVICES[@]} -eq 0 ]; then
            echo "No specific changes detected — building all services"
            CHANGED_SERVICES=("${SERVICES[@]}")
          fi

          echo "Final detected services:"
          printf '%s\n' "${CHANGED_SERVICES[@]}"

          JSON=$(printf '%s\n' "${CHANGED_SERVICES[@]}" | jq -R . | jq -s -c .)
          echo "services=$JSON" >> $GITHUB_OUTPUT
          echo "needs_migration=$NEEDS_MIGRATION" >> $GITHUB_OUTPUT

  test:
    name: Test — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Parse service
        id: svc
        run: |
          ENTRY="${{ matrix.service }}"
          echo "folder=${ENTRY%%:*}" >> $GITHUB_OUTPUT
          echo "name=${ENTRY##*:}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - name: Run tests
        run: |
          FOLDER="${{ steps.svc.outputs.folder }}"
          NAME="${{ steps.svc.outputs.name }}"
          if [ -f "${FOLDER}/Dockerfile" ]; then
            docker build --target test -t test-img ./${FOLDER} 2>/dev/null || \
            docker build -t test-img ./${FOLDER}
            docker run --rm -e NODE_ENV=test test-img npm test 2>/dev/null || \
            echo "⚠️ No tests for ${NAME}"
          fi

  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, test]
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Parse service
        id: svc
        run: |
          ENTRY="${{ matrix.service }}"
          NAME="${ENTRY##*:}"
          ENV="${{ needs.detect-changes.outputs.environment }}"
          SHORT_SHA="${GITHUB_SHA::8}"
          TAG="${ENV}-${SHORT_SHA}"
          IMAGE="${{ env.ARTIFACT_REGISTRY }}/${{ env.GCP_PROJECT_ID }}/${{ env.REGISTRY_REPO }}/${NAME}:${TAG}"

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker ${{ env.ARTIFACT_REGISTRY }} --quiet

      - uses: docker/build-push-action@v5
        with:
          context: ./apps/${{ steps.svc.outputs.name }}
          push: true
          tags: ${{ steps.svc.outputs.image }}

  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.needs_migration == 'true'

    steps:
      - run: echo "Running migrations..."

  deploy:
    name: Deploy — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Parse service
        id: svc
        run: |
          ENTRY="${{ matrix.service }}"
          NAME="${ENTRY##*:}"
          echo "name=$NAME" >> $GITHUB_OUTPUT

      - name: Deploy
        run: echo "Deploying ${{ steps.svc.outputs.name }}"

  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy]
    if: always()

    steps:
      - run: echo "Deployment complete"
