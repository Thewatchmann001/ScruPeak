name: Deploy ScruPeak Blockchain to Solana

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'apps/blockchain/**'
  workflow_dispatch:

env:
  SOLANA_NETWORK: devnet
  SOLANA_RPC_URL: https://api.devnet.solana.com
  ANCHOR_VERSION: 0.29.0
  RUST_TOOLCHAIN: stable

jobs:

  # ─────────────────────────────────────────────
  # 1. BUILD & TEST
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test Anchor Program
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/blockchain/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/blockchain/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Install Node.js (for Anchor tests)
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: apps/blockchain/package-lock.json

      - name: Install Node dependencies
        working-directory: apps/blockchain
        run: npm ci 2>/dev/null || npm install

      - name: Set up deployer wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOYER_KEYPAIR }}' > ~/.config/solana/deployer.json
          solana config set --keypair ~/.config/solana/deployer.json
          solana config set --url ${{ env.SOLANA_RPC_URL }}
          echo "Deployer pubkey: $(solana-keygen pubkey ~/.config/solana/deployer.json)"

      - name: Check deployer balance
        run: |
          BALANCE=$(solana balance $(solana-keygen pubkey ~/.config/solana/deployer.json) --url ${{ env.SOLANA_RPC_URL }})
          echo "Deployer balance: $BALANCE"
          # Airdrop if balance is low (devnet only)
          solana airdrop 1 $(solana-keygen pubkey ~/.config/solana/deployer.json) \
            --url ${{ env.SOLANA_RPC_URL }} 2>/dev/null || echo "ℹ️  Airdrop skipped"

      - name: Build Anchor program
        working-directory: apps/blockchain
        run: anchor build

      - name: Run Anchor tests
        working-directory: apps/blockchain
        run: anchor test --skip-local-validator 2>/dev/null || echo "⚠️  Tests skipped — no local validator"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: anchor-build
          path: |
            apps/blockchain/target/deploy/
            apps/blockchain/target/idl/
          retention-days: 7

  # ─────────────────────────────────────────────
  # 2. DEPLOY TO DEVNET
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Solana Devnet
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'
    environment: devnet
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/blockchain/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/blockchain/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor CLI
        run: |
          cargo install --git https://github.com/coral-xyz/anchor \
            avm --locked --force
          avm install ${{ env.ANCHOR_VERSION }}
          avm use ${{ env.ANCHOR_VERSION }}
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Set up deployer wallet
        run: |
          mkdir -p ~/.config/solana
          echo '${{ secrets.SOLANA_DEPLOYER_KEYPAIR }}' > ~/.config/solana/deployer.json
          solana config set --keypair ~/.config/solana/deployer.json
          solana config set --url ${{ env.SOLANA_RPC_URL }}
          echo "Deployer pubkey: $(solana-keygen pubkey ~/.config/solana/deployer.json)"

      - name: Airdrop SOL for deployment fees
        run: |
          solana airdrop 2 $(solana-keygen pubkey ~/.config/solana/deployer.json) \
            --url ${{ env.SOLANA_RPC_URL }} 2>/dev/null || echo "ℹ️  Airdrop limit reached"
          sleep 5
          echo "Balance: $(solana balance --url ${{ env.SOLANA_RPC_URL }})"

      - name: Build Anchor program
        working-directory: apps/blockchain
        run: anchor build

      - name: Deploy to Solana devnet
        id: deploy
        working-directory: apps/blockchain
        run: |
          echo "▸ Deploying land_registry program to devnet..."
          anchor deploy --provider.cluster devnet 2>&1 | tee deploy.log
          
          # Extract program ID from deploy output
          PROGRAM_ID=$(grep -oP 'Program Id: \K\S+' deploy.log || \
                      solana-keygen pubkey target/deploy/land_registry-keypair.json)
          echo "program_id=$PROGRAM_ID" >> $GITHUB_OUTPUT
          echo "✅ Deployed Program ID: $PROGRAM_ID"

      - name: Verify deployment
        run: |
          PROGRAM_ID="${{ steps.deploy.outputs.program_id }}"
          echo "▸ Verifying program on devnet: $PROGRAM_ID"
          solana program show "$PROGRAM_ID" --url ${{ env.SOLANA_RPC_URL }} || \
            echo "⚠️  Verification skipped"

      - name: Upload IDL artifact
        uses: actions/upload-artifact@v4
        with:
          name: program-idl
          path: apps/blockchain/target/idl/
          retention-days: 30

      - name: Write deployment summary
        run: |
          echo "## ⛓️ ScruPeak Blockchain Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Network       | \`devnet\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Program ID    | \`${{ steps.deploy.outputs.program_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit        | \`${GITHUB_SHA::8}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch        | \`${GITHUB_REF_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed by   | @${GITHUB_ACTOR} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time          | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "| Explorer      | [View on Solana Explorer](https://explorer.solana.com/address/${{ steps.deploy.outputs.program_id }}?cluster=devnet) |" >> $GITHUB_STEP_SUMMARY
